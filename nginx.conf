server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # nginx does not know the glTF types, and a model served as octet-stream is a model the
  # loader refuses.
  types {
    model/gltf-binary  glb;
    application/json   json;
    image/webp         webp;
    video/webm         webm;
    audio/webm         weba;
    text/javascript    js;
    text/css           css;
    image/svg+xml      svg;
    text/html          html;
  }
  default_type application/octet-stream;

  gzip on;
  gzip_types text/javascript text/css application/json image/svg+xml;
  # The models and audio are already compressed; gzipping them again only costs CPU.

  # Hashed bundles never change under their own name; the assets can change under theirs.
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location ~* \.(glb|webp|webm|weba|png|svg)$ { expires 7d; add_header Cache-Control "public"; }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
